/* ---------- step-by-step hints (before answering) and Vietnamese explanation (after) ----------
   Both come from Max (Groq) and are cached on this device, so a question costs one AI call at most per level. */
const HINT_CACHE=store.get('calculis-hints',{});
async function hintFor(q,level){
  const k=q.qid+'|'+level; if(HINT_CACHE[k])return HINT_CACHE[k];
  const prev=[1,2].filter(n=>n<level).map(n=>HINT_CACHE[q.qid+'|'+n]).filter(Boolean);
  const ask_=`${MAX_SYS}\n\nA beginner is stuck on this question and asked for hint number ${level} of 3.\n${level===1?'Hint 1: say what the question is really asking and the first thing to do. Do not compute anything for them.':level===2?'Hint 2: give the key idea or the key step, with a little working, but do NOT reveal the final answer or the answer letter.':'Hint 3: walk them almost to the end, leaving only the last small step. Still do NOT state the final answer or the letter.'}\nKeep it under 70 words. Plain English, no headings.${prev.length?`\nHints already given:\n${prev.map((h,i)=>`${i+1}. ${h}`).join('\n')}`:''}\n\n${qText(q,null).replace(/\n\nCorrect answer:[\s\S]*$/,'')}`;
  const r=await ask(ask_,{modelTier:'quick'}); const t=r.text.trim();
  HINT_CACHE[k]=t; const keys=Object.keys(HINT_CACHE); if(keys.length>600)delete HINT_CACHE[keys[0]]; store.set('calculis-hints',HINT_CACHE);
  return t;
}
const VI_CACHE=store.get('calculis-vi',{});
async function viExplain(q,a){
  if(VI_CACHE[q.qid])return VI_CACHE[q.qid];
  const p=`Bạn là Max, gia sư GMAT thân thiện. Hãy giải thích câu hỏi dưới đây bằng tiếng Việt cho một người mới học GMAT. Giữ nguyên các thuật ngữ tiếng Anh quan trọng (ví dụ remainder, sufficient, assumption) và ghi nghĩa tiếng Việt trong ngoặc ở lần đầu. Trình bày từng bước, ngắn gọn, khoảng 120-220 từ: (1) đề đang hỏi gì, (2) cách giải nhanh nhất, (3) vì sao đáp án đúng, (4) bẫy dễ mắc. Không dùng LaTeX, không dùng dấu gạch ngang dài.\n\n${qText(q,a)}`;
  const r=await ask(p); const t=r.text.trim();
  VI_CACHE[q.qid]=t; const keys=Object.keys(VI_CACHE); if(keys.length>300)delete VI_CACHE[keys[0]]; store.set('calculis-vi',VI_CACHE);
  return t;
}

window.__xpFly=n=>{
  setTimeout(uiChips,0); if(!n)return;
  const chip=[$('#xpChip')].find(x=>x&&x.offsetParent); if(!chip)return;
  const to=chip.getBoundingClientRect(), from=UI_PT||{x:innerWidth/2,y:innerHeight/2};
  const f=document.createElement('div');f.className='xpfly';f.textContent='+'+n+' XP';document.body.appendChild(f);
  f.style.left=from.x+'px';f.style.top=from.y+'px';
  if(uiReduced()||!f.animate){setTimeout(()=>f.remove(),900);return;}
  const dx=to.left+to.width/2-from.x, dy=to.top+to.height/2-from.y;
  f.animate([{transform:'translate(-50%,-50%) scale(.8)',opacity:0},{transform:'translate(-50%,-120%) scale(1.05)',opacity:1,offset:.25},{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.6)`,opacity:.2}],{duration:750,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>{f.remove();};
};

  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;document.body.appendChild(cv);const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  const cols=['#5A1F4E','#E0A72E','#E8692A','#7A2D6B','#F2C14E','#2C8C7A'];
  const ps=Array.from({length:count},()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.35,vx:(Math.random()-.5)*13,vy:-Math.random()*13-4,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,h:4+Math.random()*4,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(t){const k=(t-t0)/duration;ctx.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.globalAlpha=Math.max(0,1-k);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
    if(k<1)requestAnimationFrame(f);else cv.remove();})(t0);
}
function uiCele(html,cls){
  const old=$('.mc-cele');if(old)old.remove();
  const bg=document.createElement('div');bg.className='mc-cele '+(cls||'');bg.setAttribute('role','dialog');bg.setAttribute('aria-modal','true');
  bg.innerHTML=`<div class="cele-in">${html}</div>`;document.body.appendChild(bg);
  const close=()=>bg.remove();$$('[data-close]',bg).forEach(b=>b.onclick=close);bg.addEventListener('click',e=>{if(e.target===bg&&!bg.classList.contains('locked'))close();});
  setTimeout(()=>{const b=$('[data-close]',bg);b&&b.focus();},50);
  return {el:bg,close};
}

};

/* ---------- intro / onboarding ---------- */
function uiIntro(force){

  const noName=!WHO;
  const steps=[
    ()=>`<div class="cele-mc">${mascot('hi',120)}</div><h2>Hi, I am Max</h2><p>This is <b>Calculis</b>, where the group prepares for the GMAT together. Calculus + Stalis: a bit of maths, a bit of style. I am a fox, so I know a thing or two about clever shortcuts.</p>${profileForm(true)}<button class="btn cele-btn" id="inName">Next</button>`,
    ()=>`<div class="cele-mc">${mascot('hi',130)}</div><h2>Nice to meet you, ${esc(uiName())}!</h2><p>I climb the career ladder with you, from Intern to CEO. Every new title gets me some new office gear.</p>
      <div class="hats">${[0,1,2,3,4,7].map(i=>foxSVG('calm',52,i)).join('')}</div><button class="btn cele-btn" id="inNext">Next</button>`,
    ()=>{const c=plCfg();return `<div class="cele-mc">${mascot('idea',96)}</div><h2>Your target score?</h2><div class="row" style="justify-content:center">${[555,605,655,705,755,805].map(n=>`<button class="chip big" data-tg="${n}" aria-pressed="${c.target===n}">${n}</button>`).join('')}</div>
      <h2 style="margin-top:8px">Minutes a day?</h2><div class="row" style="justify-content:center">${[15,30,45,60,90].map(n=>`<button class="chip big" data-mn="${n}" aria-pressed="${c.minutes===n}">${n} min</button>`).join('')}</div>
      <h2 style="margin-top:8px">How do you want to start?</h2><div class="in-opts"><button class="btn" data-st="start">I am new to the GMAT: follow the Start here path</button><button class="btn" data-st="diag">I have studied before: take the 25-minute diagnostic</button><button class="btn" data-st="quant">Jump straight into practice</button></div>`;},
  ];
  let i=noName?0:1; const m=uiCele('','intro'+(noName?' locked':''));const box=$('.cele-in',m.el);
  const draw=()=>{box.innerHTML=steps[i]();
    const nm=$('#inName',box);if(nm)nm.onclick=async()=>{const n=$('#pfN',box).value.trim(),p=$('#pfP',box).value.trim();if(!slugOf(n)){toast('Type your name first.');return;}if(p&&p.length<4){toast('The PIN needs 4 to 6 digits.');return;}
      const k=$('#pfK',box);await setProfile(n,p,k&&k.value.trim());m.el.classList.remove('locked');i=1;draw();};
    const n=$('#inNext',box);if(n)n.onclick=()=>{i=2;draw();};
    $$('[data-tg]',box).forEach(b=>b.onclick=()=>{plCfg().target=+b.dataset.tg;touch('main');$$('[data-tg]',box).forEach(x=>x.setAttribute('aria-pressed',x===b));});
    $$('[data-mn]',box).forEach(b=>b.onclick=()=>{plCfg().minutes=+b.dataset.mn;touch('main');$$('[data-mn]',box).forEach(x=>x.setAttribute('aria-pressed',x===b));});
    $$('[data-st]',box).forEach(b=>b.onclick=()=>{store.set('calculis-intro',1);m.close();go(b.dataset.st);});};
  draw();
}

/* ================= PROFILES + STUDY GROUP =================
   Each learner: name + slug + personal PIN (web sync). Group password (APP_PASSWORD) is shared.
   Board: api/board returns everyone's weekly XP, streak, rank and score estimate. */
function uiName(){return WHO&&WHO.name?WHO.name:'there';}
function uiMonday(){const t=today();return ymd(t-((new Date(t).getDay()+6)%7)*DAY);}
function uiSummary(){
  let wxp=0;const mon=today()-((new Date(today()).getDay()+6)%7)*DAY;
  for(let d=mon;d<=today();d+=DAY){const x=(P.day||{})[ymd(d)];if(x)wxp+=x.xp||0;}
  let score=0;try{score=scoreNow().total||0;}catch(e){}
  return {name:uiName(),wxp,xp:plXPTotal(),streak:streak(),rank:mcRankIdx(),score,q:Object.keys(P.att).length,today:plDay().xp||0,week:uiMonday()};
}
function askPin(wrong){
  return new Promise(res=>{
    const m=modal(`<h2>PIN for ${esc(uiName())}</h2>
      <p class="note">${wrong?'That PIN did not match. Try again.':'Each learner has a personal PIN so nobody can overwrite anyone else. The first time you enter one, it becomes your PIN (4 to 6 digits). Remember it for your other devices.'}</p>
      <form id="pnF" class="row"><input type="password" inputmode="numeric" id="pnI" autocomplete="off" placeholder="PIN" maxlength="6" style="flex:1 1 160px"><button class="btn primary" type="submit">Done</button></form>`);
    let done=false;const fin=v=>{if(done)return;done=true;res(v);};
    $('#pnF',m.el).onsubmit=e=>{e.preventDefault();const v=$('#pnI',m.el).value.trim();if(v.length<4){toast('The PIN needs 4 to 6 digits.');return;}
      if(!WHO)WHO={name:'Learner',slug:'learner'};WHO.pin=v;store.set('calculis-who',WHO);m.close();fin(true);};
    const obs=new MutationObserver(()=>{if(!document.body.contains(m.el)){obs.disconnect();fin(false);}});obs.observe(document.body,{childList:true});
    setTimeout(()=>$('#pnI',m.el).focus(),50);
  });
}
async function setProfile(name,pin,key){
  const slug=slugOf(name); if(!slug)return false;
  const first=!WHO;
  if(!first&&WHO.slug!==slug){clearTimeout(syncTimer);if(dirty.size){try{await pushRemote();}catch(e){}}}
  WHO={name:name.trim().slice(0,30),slug,pin:pin||''}; store.set('calculis-who',WHO);
  const saved=store.get(PKEY(),null);
  if(first&&!saved){store.set(PKEY(),P);}
  else{P=Object.assign(structuredClone(DEFAULT),saved||{});P.settings=Object.assign({},DEFAULT.settings,P.settings||{});}
  dirty=new Set();TU=null;applySettings();
  if(key)setKey(key);
  if(!SYNC&&getKey())await initPlatform();
  else if(SYNC==='web'&&getKey()){await pullRemote();renderSync();}
  else if(SYNC==='web'){syncState='off';renderSync();}
  route();return true;
}
function profileForm(fresh){
  return `<div class="pf"><label class="pf-l">Your name<input type="text" id="pfN" maxlength="30" placeholder="e.g. Stalis" value="${fresh?'':esc(WHO?WHO.name:'')}"></label>
    <label class="pf-l">Personal PIN (4 to 6 digits)<input type="password" inputmode="numeric" id="pfP" maxlength="6" placeholder="Keeps your progress yours"></label>
    ${getKey()?'':`<label class="pf-l">Group password (to sync across devices)<input type="password" id="pfK" autocomplete="current-password" placeholder="Shared by the group"></label>`}
    <p class="pf-n">Use the same name, PIN and group password on another device to pick up exactly where you left off.</p></div>`;
}
function switchProfile(){
  const m=modal(`<h2>Switch learner</h2><p class="note">Sharing a device? Each person enters their own name and PIN. Progress is kept separately.</p>${profileForm(true)}<div class="row"><button class="btn primary" id="pfGo">Continue</button></div>`);
  $('#pfGo',m.el).onclick=async()=>{const n=$('#pfN',m.el).value.trim(),p=$('#pfP',m.el).value.trim();if(!slugOf(n)){toast('Type a name first.');return;}if(p&&p.length<4){toast('The PIN needs 4 to 6 digits.');return;}const k=$('#pfK',m.el);m.close();await setProfile(n,p,k&&k.value.trim());toast('Hi '+n+'!');};
}

/* ---------- study group view ---------- */
let BOARD=null, BOARD_AT=0;
async function boardLoad(force){
  if(!WEB||!WEB.sync||!getKey())return null;
  if(!force&&BOARD&&Date.now()-BOARD_AT<60000)return BOARD;
  try{const j=await api('api/board',{method:'GET'});BOARD=(j.list||[]);BOARD_AT=Date.now();}catch(e){return BOARD;}
  return BOARD;
}
function boardRows(list){
  const mon=uiMonday();
  return list.map(x=>Object.assign({},x,{wxp:x.week===mon?x.wxp:0,today:x.week===mon&&ymd(x.upd||0)===ymd(Date.now())?x.today:0}))
    .sort((a,b)=>b.wxp-a.wxp||b.streak-a.streak);
}

      <span class="bd-n"><b>${esc(x.name)}${x.slug===me?' <span class="pill ai">you</span>':''}</b><span class="small muted">${PL_RANKS[x.rank||0][1]}${x.score?`, about ${x.score}`:''}, ${x.q||0} questions tried</span></span>

      :mcSay('zzz','Nobody on the board yet. Finish one set and your name appears here.',64)}

      (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Invite copied.')).catch(()=>toast(t,6000));};

async function uiFriendsCard(){
  const side=$('.hm-side');if(!side)return;

async function boot(){
