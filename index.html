/* Calculis layout: sidebar on desktop, bottom nav on mobile, one content column. Plum accent + gold highlight. */

  --xp:#F2C14E; --xp-ink:#3D2A00; --streak-1:#FFB020; --streak-2:#FF6A1A; --seal:#C98A14;

}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0;-webkit-tap-highlight-color:transparent}

button{cursor:pointer}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.han{font-family:var(--f-han)}
.py{font-family:var(--f-py)}
ruby rt{font-family:var(--f-py);font-size:max(11px,.45em);font-weight:500;letter-spacing:0}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}

.muted{color:var(--muted)}
.small{font-size:14px}

/* shell: sidebar (>=900px) + top bar + bottom nav (<900px) */
.app{display:flex;min-height:100dvh}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.side{display:none}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);padding-top:env(safe-area-inset-top,0px)}

.top h1{font-size:19px;font-weight:800;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.brand-sm{border:0;background:none;padding:0;width:40px;height:40px;display:grid;place-items:center;flex:none}

.tools{display:flex;gap:6px;align-items:center}

.aa-btn{width:40px;height:40px;border-radius:999px;border:0;background:var(--surface);box-shadow:var(--sh-1);font-weight:800;font-size:15px}
.sync{font-size:12.5px;border-radius:999px;padding:4px 10px;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;background:var(--sunk)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--ok)}
.subnav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:1080px;width:100%;margin:0 auto;padding:4px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.subnav::-webkit-scrollbar{display:none}

.subnav button{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:650;font-size:14.5px;color:var(--ink)}

main{max-width:1080px;width:100%;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:12px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);padding:4px max(4px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-top:1px solid var(--line)}
.bnav button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;font-size:12px;font-weight:650;color:var(--muted);padding:0}
.bnav .ind{width:56px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background-color .2s var(--ease)}
.bnav .i{width:23px;height:23px}

@media (min-width:900px){
  .bnav{display:none}
  .side{display:flex;flex-direction:column;gap:6px;width:248px;flex:none;position:sticky;top:0;height:100dvh;padding:18px 14px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--surface) 55%,var(--bg))}
  .brand-sm{display:none}

  .top-in{height:64px}
  .top h1{font-size:22px}
}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px;cursor:pointer}
.brand-t{display:flex;flex-direction:column;line-height:1.2}

.side-nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;scrollbar-width:thin}

.side-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
.view{display:flex;flex-direction:column;gap:16px}
h2{font-size:20px;margin:0;text-wrap:balance;letter-spacing:-.01em}

.label{font-size:13px;color:var(--muted);font-weight:650}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:0;box-shadow:var(--sh-1);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.chip{border:1.5px solid var(--line2);background:var(--surface);border-radius:999px;min-height:36px;padding:0 14px;font-size:14px;font-weight:600;position:relative}
.chip::after{content:"";position:absolute;inset:-4px}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.btn{border:1.5px solid var(--line2);background:var(--surface);border-radius:14px;min-height:44px;padding:0 18px;font-weight:650;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover:not(:disabled){border-color:var(--accent)}

.btn:active:not(:disabled){transform:translateY(1px)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;font-weight:600;border-radius:12px;position:relative}

.pill{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ai{background:var(--accent-soft);color:var(--accent)}
.kbd{font-family:var(--f-py);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
input[type=text],input[type=search],input[type=number],select,textarea{border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:8px 12px;min-width:0}

.note{font-size:14px;color:var(--muted);margin:0}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r)}
.bar-track{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:14.5px;font-weight:550;z-index:70;max-width:calc(100% - 32px);box-shadow:var(--sh-2);animation:toastIn .22s var(--ease-out)}

/* home */
.wotd{display:flex;gap:14px;align-items:center}

.heat i.h1{background:var(--heat1)}.heat i.h2{background:var(--heat2)}.heat i.h3{background:var(--heat3)}.heat i.h4{background:var(--heat4)}

/* study card */
.study{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:start}

.card{background:var(--surface);border:0;border-radius:var(--r-lg);padding:28px 22px 22px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-height:360px;position:relative;box-shadow:var(--shadow)}

.wd-head .h{font-size:64px;font-weight:700;line-height:1}
.wd-head .em{font-size:52px}
.strokes{display:flex;gap:10px;flex-wrap:wrap}
.strokes .box{width:110px;height:110px;border:1px solid var(--line);border-radius:10px;background:var(--surface);position:relative}
.strokes .box svg{display:block}
.illus{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;max-width:420px}
.illus img{display:block;width:100%;height:auto}
.ai-out{white-space:pre-wrap;font-size:14.5px;background:var(--sunk);border-radius:10px;padding:12px 14px}

/* writing */
.write-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:700px){.write-wrap{grid-template-columns:minmax(0,1fr)}}
.wpad{width:min(320px,86vw);height:min(320px,86vw);border:1px solid var(--line2);border-radius:14px;background:var(--surface);position:relative;touch-action:none;margin:0 auto}
.wpad svg.grid{position:absolute;inset:0;pointer-events:none}
.wpad .hw{position:absolute;inset:0}

/* grammar */
.g{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.g>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;gap:10px;align-items:center}
.g>summary::-webkit-details-marker{display:none}
.g>summary .t{font-weight:600;flex:1;min-width:0}
.g[open]>summary{border-bottom:1px solid var(--line)}
.g .body{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.formula{font-family:var(--f-py);background:var(--sunk);border-radius:8px;padding:8px 12px;font-size:14px;overflow-x:auto}
.vn{font-size:13.5px;background:var(--accent-soft);border-radius:8px;padding:8px 12px}
.gq{border:1px dashed var(--line2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line2);display:inline-grid;place-items:center;flex:none;font-size:12px}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* quiz options shared */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:520px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;min-height:44px}
.opt:disabled{opacity:1}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.opt .zh{font-size:17px}

/* test */
.tcard{display:flex;flex-direction:column;gap:6px}
.runner-head{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:var(--shadow)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px}
.timer.low{color:var(--bad)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.q .qn{font-weight:700;color:var(--muted);font-size:13px}
.q .text{font-size:18px;line-height:1.75}
.q .stmt{font-size:17px}
.q .w{font-size:13.5px;background:var(--sunk);border-radius:8px;padding:8px 12px}
.q.r-ok{border-color:var(--ok)}.q.r-bad{border-color:var(--bad)}
.pieces{display:flex;flex-wrap:wrap;gap:6px}
.piece{border:1px solid var(--line2);background:var(--sunk);border-radius:8px;padding:6px 10px;font-family:var(--f-han);font-size:18px}
.piece.used{opacity:.3}
.built{min-height:46px;border:1.5px dashed var(--line2);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.score .s{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.score .s b{font-size:28px;display:block;font-variant-numeric:tabular-nums}
.play{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.audio-lines{font-size:15px;background:var(--sunk);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}

/* chat */
.chat{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.chat{grid-template-columns:minmax(0,1fr)}}
.scen{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow-y:auto}
.scen button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;text-align:left;display:flex;gap:10px;align-items:center}
.scen button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.scen .e{font-size:20px}
.convo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:480px}
.msgs{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;max-height:62vh}
.msg{max-width:88%;display:flex;flex-direction:column;gap:4px}
.msg.me{align-self:flex-end;align-items:flex-end}
.bubble{border-radius:14px;padding:10px 13px;background:var(--sunk)}
.msg.me .bubble{background:var(--accent);color:var(--accent-ink)}
.bubble .zh{font-size:19px;line-height:1.9}
.bubble ruby rt{font-family:var(--f-py);font-size:10.5px;color:var(--muted)}
.bubble .vi{font-size:13.5px;color:var(--muted);margin-top:4px}
.fix{font-size:13px;border-left:3px solid var(--warn);padding:4px 10px;background:color-mix(in srgb,var(--warn) 10%,var(--surface));border-radius:0 8px 8px 0;max-width:100%}
.composer{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
.composer .row textarea{flex:1;min-height:44px}
.hints{display:flex;flex-wrap:wrap;gap:6px}
.hints button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-family:var(--f-han);font-size:15px}
.typing{color:var(--muted);font-size:13px}

/* tones */
.tones{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:760px){.tones{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tone{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left}
.tone svg{width:100%;height:auto}
.tone .tn{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tonebtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tonebtns .btn{font-size:20px;font-family:var(--f-py)}
@media (prefers-reduced-motion:no-preference){.opt,.card,.btn{transition:border-color .15s,background .15s}}

@media (max-width:560px){.sync-t{display:none}.sync{padding:6px}}

/* strokes */
.steps{display:flex;flex-wrap:wrap;gap:6px}
.step{width:76px;height:76px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:3px;position:relative}
.step svg{width:100%;height:100%;display:block}
.step .num{position:absolute;left:4px;top:2px;font-size:10px;color:var(--muted)}
.rule{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:start}
.rn{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:700}
.rx{font-size:18px}
.lnk{border:0;background:none;padding:0 2px;color:var(--accent);text-decoration:underline dotted;text-underline-offset:3px}
.stypes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.stypes{grid-template-columns:minmax(0,1fr)}}
.stype{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;align-items:center}
.sx{font-size:30px;text-align:center}
/* pinyin */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pk{font-size:26px;font-weight:700;color:var(--accent)}
.pexs{display:flex;flex-wrap:wrap;gap:6px}
.pex{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:4px 9px;font-size:13.5px;text-align:left}
.pex .han{font-size:17px}
.ptable-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-height:70vh}
.ptable{border-collapse:collapse;font-size:12.5px}
.ptable th{position:sticky;top:0;background:var(--sunk);padding:5px 6px;font-weight:600;z-index:1}
.ptable tbody th{left:0;z-index:2}
.ptable td{border:1px solid var(--line);padding:0}
.ptable td button{border:0;background:none;padding:5px 6px;width:100%;white-space:nowrap}
.ptable td button:hover{background:var(--accent-soft)}
/* radicals */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;text-align:center}
.rcard:hover{border-color:var(--accent)}
.rnum{position:absolute;top:5px;left:8px;font-size:10.5px;color:var(--muted)}
.rch{font-size:38px;line-height:1.15}
.rv{font-size:15px;color:var(--muted);min-height:18px}
.rhv{font-weight:700;text-transform:capitalize}

.mk-ok{color:var(--ok)} .mk-bad{color:var(--bad);text-decoration:underline wavy;text-underline-offset:5px}
.reader{max-width:780px}
.rtext{display:flex;flex-direction:column;gap:14px}
.rpara p{margin:0}
.rpara .han{font-size:22px;line-height:2.1}
.rpara ruby rt{font-family:var(--f-py);font-size:11px;color:var(--muted)}
.rvi{color:var(--muted);font-size:15px;margin-top:4px!important}
.rw{cursor:pointer;border-radius:4px}
.rw:hover{background:var(--accent-soft)}
.rlook{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:6px;z-index:6}
.rpara .spk{width:28px;height:28px;vertical-align:middle;margin-left:4px}
.rpara .spk svg{width:13px;height:13px}

/* pitch trainer */
.pt{display:flex;flex-direction:column;gap:12px;min-width:0}
.pt-pick{display:flex;flex-direction:column;gap:10px;min-width:0}
.pt-pick input[type=search]{width:100%}
.pt-tones{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pt-tb{flex-direction:column;gap:0;padding:8px 4px}
.pt-tb .han{font-size:24px;font-weight:700;line-height:1.2}
.pt-tb .py{font-size:14px;font-weight:500}
.pt-tb[aria-pressed="true"],.pt-pc[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pt-grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:440px}
.pt-pc{flex-direction:column;gap:0;font-weight:700;padding:6px 2px}
.pt-pc .py{font-size:11.5px;font-weight:400}
.pt-rc{display:inline-flex;gap:4px;align-items:baseline}
.pt-rc .han{font-size:17px}
.pt-item{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.pt-word{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.pt-h{font-size:40px;font-weight:700;line-height:1.1}
.pt-p{font-size:20px;font-weight:500}
.pt-btns{display:flex;flex-wrap:wrap;gap:8px}
.pt-btns .btn{flex:1 1 auto}
.pt-on{background:var(--bad)!important;border-color:var(--bad)!important;color:var(--accent-ink)!important}
.pt-dot{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block;animation:pt-blink 1s infinite}
@keyframes pt-blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pt-dot{animation:none}}
.pt-bar{max-width:320px}
.pt-msg{font-size:13.5px;background:var(--sunk);border-left:3px solid var(--warn);border-radius:8px;padding:10px 12px}
.pt-chart{display:flex;flex-direction:column;gap:6px;min-width:0;max-width:640px}
.pt-chart svg{width:100%;max-width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pt-chart svg text{font-family:var(--f-py)}
.pt-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.pt-legend span{display:inline-flex;align-items:center;gap:6px}
.pt-k{display:inline-block;width:22px;height:0;border-top:3px solid var(--accent)}
.pt-km{border-top-color:var(--t4)}
.pt-ki{border-top:2px dashed var(--muted)}
.pt-total{display:flex;align-items:baseline;gap:8px}
.pt-total b{font-size:30px;line-height:1}
.pt-fbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.pt-fbc{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:14px;min-width:0}
.pt-fbh{display:flex;align-items:baseline;gap:8px}
.pt-fbh .py{font-size:18px;font-weight:600}
.pt-sc{margin-left:auto;font-weight:700;font-size:15px;padding:1px 8px;border-radius:999px;border:1px solid currentColor}
.pt-sc.ok{color:var(--ok)}.pt-sc.mid{color:var(--warn)}.pt-sc.low{color:var(--bad)}
.pt-tipbox{font-size:13.5px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 12px}

/* games */
.gm-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.gm-cards{grid-template-columns:minmax(0,1fr)}}
.gm-card{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.gm-card:hover{border-color:var(--accent)}
.gm-ic{flex:none;width:56px;height:56px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:30px;font-weight:700}
.gm-ct{display:flex;flex-direction:column;gap:4px;min-width:0;align-items:flex-start}
.gm-ct b{font-size:16px}
.gm-board{display:flex;flex-direction:column}
.gm-brow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.gm-brow:first-child{border-top:0}
.gm-bic{width:32px;height:32px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-size:17px}
.gm-bname{display:flex;flex-direction:column;line-height:1.3;font-weight:600;min-width:0}
.gm-brow b{font-size:20px}
.gm-stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 18px;display:flex;flex-direction:column;gap:14px;min-height:520px;box-shadow:var(--shadow);min-width:0}
.gm-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gm-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gm-hud{display:flex;align-items:center;gap:12px;margin-left:auto}
.gm-pts{font-size:22px;font-weight:700;min-width:2ch;text-align:right}
.gm-body{display:flex;flex-direction:column;gap:14px;flex:1;min-width:0}
.gm-start,.gm-end{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:18px 4px}
.gm-bigic{width:88px;height:88px;border-radius:22px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:50px;font-weight:700}
.gm-rules{text-align:left;max-width:480px;margin:0;padding-left:20px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:4px}
.gm-go{min-width:180px;font-size:16px;padding:12px 22px}
.gm-count{flex:1;display:grid;place-items:center;min-height:340px}
.gm-count span{font-size:96px;font-weight:700;color:var(--accent)}
.gm-tbar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.gm-tbar i{display:block;height:100%;width:100%;background:var(--accent);border-radius:4px}
.gm-tbar.low i{background:var(--bad)}
.gm-sp{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:190px;gap:6px}
.gm-combo{min-height:26px}
.gm-cb{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.gm-cb.hot{background:color-mix(in srgb,var(--warn) 20%,var(--surface));color:var(--warn)}
.gm-word{--n:2;font-size:clamp(40px,calc(96px - var(--n) * 10px),86px);font-weight:700;line-height:1.15;text-align:center;overflow-wrap:anywhere}
.gm-fxh{position:absolute;right:12%;top:30%;pointer-events:none}
.gm-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gm-opt{display:flex;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:60px;font-size:15px;min-width:0;overflow-wrap:anywhere}
.gm-opt:hover{border-color:var(--accent)}
.gm-k{flex:none;width:24px;height:24px;border-radius:6px;background:var(--sunk);color:var(--muted);display:grid;place-items:center;font-size:12px;font-weight:700}
.gm-opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--surface))}
.gm-opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--surface))}
.gm-float{position:absolute;font-weight:700;font-size:15px;white-space:nowrap;max-width:calc(100% - 8px);overflow:hidden;text-overflow:ellipsis;pointer-events:none;z-index:3;padding:2px 8px;border-radius:8px;background:var(--surface);box-shadow:var(--shadow)}
.gm-fxh .gm-float{font-size:22px;background:transparent;box-shadow:none}
.gm-float.ok{color:var(--ok)}.gm-float.bad{color:var(--bad)}
.gm-mround{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gm-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:600px){.gm-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}}
.gm-mc{min-height:88px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px;display:grid;place-items:center;text-align:center;min-width:0;overflow-wrap:anywhere;line-height:1.3}
.gm-mc.is-h{font-size:28px;font-weight:700;background:var(--sunk)}
.gm-mc.is-v{font-size:13.5px}
.gm-mc.sel{border-color:var(--accent);background:var(--accent-soft)}
.gm-mc.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--surface))}
.gm-mc.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.gm-mc.gone{visibility:hidden;opacity:0}
.gm-field{position:relative;height:clamp(300px,52vh,460px);overflow:hidden;border:1px solid var(--line);border-radius:12px;background:linear-gradient(var(--sunk),color-mix(in srgb,var(--sunk) 40%,var(--surface)))}
.gm-floor{position:absolute;left:0;right:0;bottom:0;height:6px;background:color-mix(in srgb,var(--bad) 45%,transparent)}
.gm-drop{position:absolute;left:0;top:0;font-size:28px;font-weight:700;padding:2px 10px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;box-shadow:var(--shadow);white-space:nowrap;will-change:transform;z-index:1}
.gm-drop.hit,.gm-drop.target{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.gm-type{display:flex;gap:8px}
.gm-type input{flex:1;font-size:18px;font-family:var(--f-py);padding:10px 14px;min-width:0}
.gm-lives{display:flex;gap:2px;font-style:normal}
.gm-lives i{font-style:normal;color:var(--line2);font-size:17px}
.gm-lives i.on{color:var(--bad)}
.gm-tone{display:flex;flex-direction:column;gap:14px}
.gm-tq{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:6px}

/* profiles + study group */

.bd-pos{width:22px;font-weight:800;font-size:17px;color:var(--muted);text-align:center;flex:none}

.bd-mc{flex:none}
.bd-n{display:flex;flex-direction:column;flex:1;min-width:0;line-height:1.35}

.bd-st{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}

.inv{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}

/* ===== Catalis core additions (English text, vocab cards, band widgets, quiz) ===== */

mark{background:var(--orange-soft);color:inherit;border-radius:4px;padding:0 2px}

.brand-t span{font-style:italic}
.seal-rk{font-size:14px;letter-spacing:.02em}
.stamp{font-size:30px}
.rk-n{font-weight:700;font-size:12.5px}
.band-mini .label{margin:0}
.bm-row{display:flex;align-items:baseline;gap:10px}
.bm-arrow{color:var(--muted);font-weight:700}
.bm-t{font-size:22px;font-weight:800;color:var(--orange)}
.bands{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}

.bd-c{background:var(--sunk);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}

.bd-c.ov{background:var(--accent);color:var(--accent-ink)}
.sc-list{display:flex;flex-direction:column;margin-top:6px}
.band-big{font-size:56px;font-weight:800;color:var(--accent);line-height:1}
.place-res{flex-direction:row;align-items:center;gap:16px}
@media (max-width:560px){.place-res{flex-direction:column;align-items:flex-start}}

.tabs{gap:6px}

.sec-hero.verbal{background:linear-gradient(155deg,#8A3B5C,#5A1F4E 60%,#3A1233)}
.sec-hero.di{background:linear-gradient(155deg,#4F2C73,#5A1F4E 60%,#3A1233)}
.sc-hero{justify-content:flex-start}
.q-meta{display:flex;flex-wrap:wrap;gap:6px}
.pill.d1{background:var(--t3-soft);color:var(--t3)}.pill.d2{background:var(--t4-soft);color:var(--t4)}.pill.d3{background:var(--orange-soft);color:var(--orange-ink)}.pill.d4{background:var(--t2-soft);color:var(--t2)}.pill.d5{background:var(--t1-soft);color:var(--t1)}
/* layout */
.runv{gap:12px}

.pane-r,.single{display:flex;flex-direction:column;gap:12px;min-width:0}

.pass{font-family:var(--f-en);font-size:16.5px;line-height:1.65}

.pass-t{font-family:var(--f-body);font-size:16px;margin:0 0 10px}
.pn{display:inline-block;min-width:20px;font-family:var(--f-body);font-size:11px;font-weight:800;color:var(--muted);vertical-align:2px;margin-right:4px}
.stem{font-size:16.5px;line-height:1.6}
.stem p{margin:0 0 8px}

.gopt[aria-pressed="true"] .ol{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.gopt.right .ol{background:var(--ok);border-color:var(--ok);color:#fff}
.gopt.wrong .ol{background:var(--bad);border-color:var(--bad);color:#fff}
.gopt .ot{min-width:0;overflow-wrap:anywhere}
/* statement and two-part tables */
.stm{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:15px}
.stm th{font-size:12.5px;color:var(--muted);font-weight:700;text-align:center;padding:0 6px;white-space:nowrap}
.stm th:last-child{text-align:left}
.stm td{background:var(--sunk);padding:8px 6px;vertical-align:middle}
.stm td:first-child{border-radius:10px 0 0 10px}.stm td:last-child{border-radius:0 10px 10px 0}
.stm td.rb{width:52px;text-align:center}
.stm td.st{line-height:1.5}
.stm tr.ok td{background:var(--ok-soft)}.stm tr.bad td{background:var(--bad-soft)}
.radio{width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);background:var(--surface);padding:0;position:relative}
.radio[aria-pressed="true"]{border-color:var(--accent)}
.radio[aria-pressed="true"]::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--accent)}
.radio.key{box-shadow:0 0 0 3px var(--ok)}
.radio.miss[aria-pressed="true"]::after{background:var(--bad)}
.radio:disabled{opacity:1}
.tpa td.rb{width:64px}
/* data tables */
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--sunk);text-align:left;padding:8px 10px;font-weight:700;font-size:13px;white-space:nowrap;position:relative;user-select:none}

.tbl th[data-dir="asc"] .srt{border-top-color:transparent;border-bottom-color:var(--accent);margin-top:-6px}
.tbl th[data-dir="desc"] .srt{border-top-color:var(--accent)}
.tbl td{padding:7px 10px;border-top:1px solid var(--line);white-space:nowrap}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}

.fc-back{font-size:17px;line-height:1.55;max-width:560px;border-top:1px dashed var(--line);padding-top:14px}
.cd-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.cd-row{display:flex;flex-direction:column;gap:2px;border-bottom:1px dashed var(--line);padding:6px 0}
/* tutor chat */
.chat-box{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow:auto;padding:2px}
.chat-box.big{max-height:none;min-height:200px}
.cm{display:flex;gap:8px;align-items:flex-start}
.cm.me{justify-content:flex-end}
.cm-av{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;overflow:hidden}
.cm-b{background:var(--surface);box-shadow:var(--sh-1);border-radius:14px;padding:10px 12px;max-width:min(640px,86%);line-height:1.55;font-size:15px;overflow-wrap:anywhere}
.modal .cm-b{background:var(--sunk);box-shadow:none}
.cm.me .cm-b{background:var(--accent);color:var(--accent-ink)}
.cm-b p{margin:0 0 6px}.cm-b p:last-child{margin:0}.cm-b ul,.cm-b ol{margin:0 0 6px;padding-left:20px}
.am-q{gap:6px}
.composer textarea,.composer input{min-height:44px}
.modal.wide{width:min(980px,100%)}
body.busy .bnav{display:none}
body.busy #view{padding-bottom:24px}
.hats{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
/* start path, glossary, hints, mental math */
.st-next{border:1.5px solid var(--orange);text-align:left;gap:4px}
.st-stage summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none}
.st-stage summary::-webkit-details-marker{display:none}
.st-list{display:flex;flex-direction:column;margin-top:8px}
.st-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line)}
.st-row.cur{background:var(--orange-soft);border-radius:12px;padding:8px;border-top-color:transparent}
.st-row.lock{opacity:.55}
.st-ic{width:32px;height:32px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.st-ic .i{width:17px;height:17px}
.st-row.done .st-ic{background:var(--ok-soft);color:var(--ok)}
.st-t{flex:1;display:flex;flex-direction:column;min-width:0}
.gl-list{display:flex;flex-direction:column;gap:8px}
.gl-row{background:var(--surface);box-shadow:var(--sh-1);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:3px}
.gl-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.gl-h b{font-size:16.5px}
.gl-vi{color:var(--accent);font-weight:600}
.gl-ex{font-family:var(--f-en);color:var(--ink)}
.hints-box{display:flex;flex-direction:column;gap:8px}
.hint{background:var(--orange-soft);color:var(--orange-ink);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.55}
.expl.vi{border-left:4px solid var(--accent)}
.expl.vi ul,.expl.vi ol{margin:0 0 8px;padding-left:20px}
.mm-card{align-items:center;text-align:center;gap:14px;padding:28px 18px}
.mm-q{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums}
.mm-in{font-size:24px;text-align:center;max-width:180px;font-weight:700}
.mm-miss{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.mm-miss .pill{text-transform:none;font-size:13px;letter-spacing:0}

</style>

<script>
(function(){
'use strict';
/* Calculis core: helpers, data bank, progress state, sync, routing, shared UI.
   Feature modules (src/features/*.js) are pasted before the boot marker by build.py. */

/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.random()*a.length|0];
const DAY=86400000;
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime();};
const ymd=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fold=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
const ic=(n,cls)=>`<svg class="i${cls?' '+cls:''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
function toast(msg,ms=2600){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms);}
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const fmtTime=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
const LET='ABCDE';
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
/* inline text: **bold** (boldface CR) and line breaks; everything else escaped */
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b class="bf">$1</b>').replace(/\n/g,'<br>');
const paras=s=>String(s||'').split(/\n{2,}/).map(p=>`<p>${fmt(p)}</p>`).join('');

/* ================= question bank =================
   data/*.json are built by tools/build_data.py from content/out. Everything is normalised into
   UNITS (what is shown on one screen: a single item, an RC passage or an MSR set) and QS (single scorable questions).
   q = {qid, sec:'quant'|'verbal'|'di', type:'ps'|'ds'|'cr'|'rc'|'ta'|'gi'|'tpa'|'msr', diff, topic, sub, unit, i (index in unit), src (raw)} */
const SECS=['quant','verbal','di'];
const SEC_NAME={quant:'Quant',verbal:'Verbal',di:'Data Insights'};
const SEC_LONG={quant:'Quantitative Reasoning',verbal:'Verbal Reasoning',di:'Data Insights'};
const TYPE_NAME={ps:'Problem Solving',ds:'Data Sufficiency',cr:'Critical Reasoning',rc:'Reading Comprehension',ta:'Table Analysis',gi:'Graphics Interpretation',tpa:'Two-Part Analysis',msr:'Multi-Source Reasoning'};
const DIFF_NAME={1:'Foundation',2:'Medium',3:'Hard',4:'Very hard',5:'Elite'};
const DIFF_SCORE={1:'below 555',2:'555-605',3:'605-655',4:'655-705',5:'705+'};
const UNITS=[], QS=[], QI=new Map(), UI_=new Map();
const JCACHE={};
function loadJSON(name){if(!JCACHE[name])JCACHE[name]=fetch('data/'+name+'.json').then(r=>{if(!r.ok)throw new Error(name);return r.json();}).catch(e=>{delete JCACHE[name];throw e;});return JCACHE[name];}
const BANK_FILES=['quant','ds','cr','rc','di'];
let BANK=null;
function topicOf(x){
  if(x.type==='ps')return x.topic||'Quant';
  if(x.type==='cr')return 'CR: '+(x.qtype||'other');
  if(x.type==='rc')return 'Reading Comprehension';
  return TYPE_NAME[x.type]||x.type;
}
function addUnit(u){UNITS.push(u);UI_.set(u.id,u);u.qs.forEach((q,i)=>{q.unit=u;q.i=i;QS.push(q);QI.set(q.qid,q);});}
function loadBank(){
  if(BANK)return BANK;
  BANK=Promise.all(BANK_FILES.map(f=>loadJSON(f).catch(()=>[]))).then(parts=>{
    parts.flat().forEach(x=>{
      if(!x||!x.id||QI.has(x.id))return;
      const sec=x.sec||(x.type==='ps'?'quant':x.type==='cr'||x.type==='rc'?'verbal':'di');
      const base={sec,type:x.type,topic:topicOf(x),sub:x.sub||x.qtype||'',src:x};
      if(x.type==='rc'){
        const u={id:x.id,sec,type:'rc',diff:x.diff,topic:x.topic||'',title:x.title||'',src:x,qs:[]};
        u.qs=(x.questions||[]).map((q,i)=>Object.assign({},base,{qid:q.id||x.id+'-q'+(i+1),diff:q.diff||x.diff,sub:q.qtype||'',sq:q}));
        addUnit(u);
      }else if(x.type==='msr'){
        const u={id:x.id,sec,type:'msr',diff:x.diff,topic:base.topic,src:x,qs:[]};
        u.qs=(x.questions||[]).map((q,i)=>Object.assign({},base,{qid:x.id+'-q'+(i+1),diff:x.diff,sub:q.kind,sq:q}));
        addUnit(u);
      }else{
        addUnit({id:x.id,sec,type:x.type,diff:x.diff,topic:base.topic,src:x,qs:[Object.assign({},base,{qid:x.id,diff:x.diff,sq:x})]});
      }
    });
    return QS;
  });
  return BANK;
}
/* correct answer and checking, per type. Answers: number (choice), array (statement labels / tpa / gi blanks) */
function keyOf(q){
  const s=q.sq;
  if(q.type==='ta')return s.statements.map(t=>t.answer);
  if(q.type==='gi')return s.blanks.map(b=>b.answer);
  if(q.type==='tpa')return s.answer.slice();
  if(q.type==='msr'&&s.kind==='yesno')return s.statements.map(t=>t.answer);
  return s.answer;
}
function complete(q,a){if(a==null)return false;const k=keyOf(q);if(Array.isArray(k))return Array.isArray(a)&&k.every((_,i)=>a[i]!=null);return true;}
function isRight(q,a){if(a==null)return false;const k=keyOf(q);if(Array.isArray(k))return Array.isArray(a)&&k.every((v,i)=>a[i]===v);return a===k;}
/* chance of a lucky guess, used by the ability model */
function guessP(q){const s=q.sq;if(q.type==='ta'||(q.type==='msr'&&s.kind==='yesno'))return 0.125;if(q.type==='tpa')return 1/((s.options||[]).length**2||25);if(q.type==='gi')return 1/s.blanks.reduce((a,b)=>a*b.options.length,1);return 0.2;}
const targetTime=q=>{const s=q.sq;if(q.type==='msr')return Math.round((q.unit.src.time||420)/3);if(q.type==='rc')return s.time||(q.i===0?150:80);return s.time||120;};

/* ================= ability model =================
   3-parameter logistic, item difficulty b = diff-3 (diff units), slope 1.3, guessing c = guessP(q).
   theta is found on a grid with a weak normal prior (mean 0, sd 1.6), so few answers do not swing it wildly.
   Section score = 81 + 2.8*theta above theta -1 (diff 3 ~ 81, diff 5 ~ 87), 5 points per unit below (diff 1 ~ 73), clamped 60-90.
   Total = 205 + 10*round((Q+V+DI-180)*2/3), clamped 205-805. Estimates only: GMAC does not publish its exact model. */
function pCorrect(theta,q){const c=guessP(q),b=(q.diff||3)-3;return c+(1-c)/(1+Math.exp(-1.3*(theta-b)));}
function estTheta(res,mu=0){ // res: [{q, ok}]
  if(!res.length)return null; let best=0,bl=-1e9;
  for(let t=-4;t<=4.0001;t+=0.05){let l=-((t-mu)*(t-mu))/(2*1.6*1.6);for(const r of res){const p=clamp(pCorrect(t,r.q),1e-6,1-1e-6);l+=r.ok?Math.log(p):Math.log(1-p);}if(l>bl){bl=l;best=t;}}
  return Math.round(best*100)/100;
}
const secScore=theta=>theta==null?null:clamp(Math.round(theta>=-1?81+2.8*theta:78.2+5*(theta+1)),60,90); // steeper below diff 2 so very weak runs land near the bottom of the scale

const fmtScore=s=>s==null?'-':String(s);

const DEFAULT={v:1,upd:0,settings:{theme:'',noMascot:false,mute:false,cardsPerDay:15},srs:{},hist:{},day:{},att:{},err:{},mocks:[],lessons:{}};

/* attempts: P.att[qid] = {n, ok (times right), last (ts), lastOk, t (seconds last time), a (last answer)} */
function recordAttempt(q,a,secs,{mode='practice'}={}){
  const ok=isRight(q,a); const r=P.att[q.qid]||{n:0,ok:0};
  r.n++; if(ok)r.ok++; r.last=Date.now(); r.lastOk=ok; r.t=Math.round(secs||0); r.m=mode==='mock'?1:0;
  P.att[q.qid]=r;
  // error log: wrong answers go in; an item in the log answered right twice later counts as fixed
  const e=P.err[q.qid];
  if(!ok){P.err[q.qid]=Object.assign(e||{t:Date.now(),reason:'',note:''},{last:Date.now(),fix:0,a,miss:((e&&e.miss)||0)+1});}
  else if(e&&!e.done){e.fix=(e.fix||0)+1;if(e.fix>=2){e.done=Date.now();}}
  touch('main');
  return ok;
}
/* ability per section from practice and mocks: latest outcome of the 80 most recent items */
function secResults(sec,limit=80){
  return Object.entries(P.att).map(([id,r])=>({q:QI.get(id),r})).filter(x=>x.q&&x.q.sec===sec).sort((a,b)=>b.r.last-a.r.last).slice(0,limit).map(x=>({q:x.q,ok:!!x.r.lastOk}));
}
function secEstimate(sec){const res=secResults(sec);if(res.length<8)return {n:res.length,score:null,theta:null};const th=estTheta(res);return {n:res.length,theta:th,score:secScore(th)};}

/* SRS (SM-2 style) for flashcards, keyed by card id */
function schedule(k,r){ // r: 0 again,1 hard,2 good,3 easy
  const now=Date.now(); let c=P.srs[k]||{iv:0,ef:2.5,n:0,l:0,due:now,s:0,first:now};
  if(r===0){c.l++;c.n=0;c.iv=0;c.ef=Math.max(1.3,c.ef-0.2);c.due=now+60*1000;c.s=1;}
  else{
    if(r===1){c.iv=c.iv<1?1:Math.max(1,Math.round(c.iv*1.2));c.ef=Math.max(1.3,c.ef-0.15);}
    else if(r===2){c.iv=c.n===0?1:c.n===1?3:Math.round(c.iv*c.ef);}
    else{c.iv=c.n===0?4:Math.round(Math.max(c.iv,1)*c.ef*1.3);c.ef+=0.15;}
    c.n++;c.s=2;c.due=today()+c.iv*DAY;
  }
  P.srs[k]=c; touch('main');
  return c;
}
function ivLabel(k,r){
  const c=Object.assign({iv:0,ef:2.5,n:0},P.srs[k]||{});
  if(r===0)return '1 min';
  const iv= r===1?(c.iv<1?1:Math.max(1,Math.round(c.iv*1.2))): r===2?(c.n===0?1:c.n===1?3:Math.round(c.iv*c.ef)) : (c.n===0?4:Math.round(Math.max(c.iv,1)*c.ef*1.3));
  return iv<30? iv+(iv===1?' day':' days') : iv<365? Math.round(iv/30)+' mo' : (iv/365).toFixed(1)+' yr';
}
const known=k=>{const c=P.srs[k];return !!(c&&c.s===2&&c.iv>=7);};
function newToday(){const t=today();return Object.values(P.srs).filter(c=>c.first>=t).length;}
function streak(){let s=0,t=today();const on=k=>P.hist[k]||((P.day||{})[k]&&P.day[k].xp);if(!on(ymd(t)))t-=DAY;while(on(ymd(t))){s++;t-=DAY;}return s;}

function askPassword(wrong){
  return new Promise(res=>{
    const m=modal(`<h2>Group password</h2>
      <p class="note">${wrong?'That password did not work. Try again.':'Enter the group password to unlock the AI tutor and sync your progress across devices. Each device asks only once.'}</p>
      <form id="pwF" class="row"><input type="password" id="pwI" autocomplete="current-password" placeholder="Password" style="flex:1 1 200px"><button class="btn primary" type="submit">Unlock</button></form>`);
    let done=false; const fin=v=>{if(done)return;done=true;res(v);};
    $('#pwF',m.el).onsubmit=e=>{e.preventDefault();const v=$('#pwI',m.el).value.trim();if(!v)return;setKey(v);m.close();fin(true);};
    const obs=new MutationObserver(()=>{if(!document.body.contains(m.el)){obs.disconnect();fin(false);}});obs.observe(document.body,{childList:true});

async function api(path,{method='POST',body}={}){
  for(let i=0;i<3;i++){
    if(!getKey()){const ok=await askPassword(false);if(!ok)throw {code:'not_granted'};}
    let r; const hd={'content-type':'application/json','x-app-key':getKey()};
    if(WHO){hd['x-user']=WHO.slug;if(WHO.pin)hd['x-user-pin']=WHO.pin;}
    try{r=await fetch(path,{method,headers:hd,body:body?JSON.stringify(body):undefined});}catch(e){throw {code:'network'};}
    if(r.status===401){setKey('');const ok=await askPassword(true);if(!ok)throw {code:'not_granted'};continue;}
    if(r.status===429)throw {code:'rate_limited'};
    if(r.status===403||(r.status===400&&path.includes('sync'))){const ok=await askPin(r.status===403&&WHO&&WHO.pin);if(!ok)throw {code:'not_granted'};continue;}
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw {code:j.error||'upstream',data:j.data};
    return j;
  }
  throw {code:'not_granted'};
}
function parseJSON(text){
  const t=String(text).trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'');
  try{return JSON.parse(t);}catch(e){}
  const a=Math.min(...['{','['].map(c=>{const k=t.indexOf(c);return k<0?1e9:k;})), b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));
  if(a<1e9&&b>a){try{return JSON.parse(t.slice(a,b+1));}catch(e){}}
  throw {code:'bad_json'};
}
function makeWebAI(){
  const call=async(input,opts={})=>{
    const messages=typeof input==='string'?[{role:'user',content:input}]:input;
    const j=await api('api/ai',{body:{messages,tier:opts.modelTier||'default'}});
    return {text:String(j.text||''),truncated:!!j.truncated};
  };
  call.json=async(input,opts={})=>{
    const add='\n\nReturn only valid JSON, no other text, no ``` fences.';
    const msg=typeof input==='string'?input+add:input.map((m,i)=>i===input.length-1?{role:m.role,content:m.content+add}:m);
    const {text}=await call(msg,opts);
    return parseJSON(text);
  };
  return call;
}
async function ask(prompt,opts={}){ if(!AI)throw {code:'no_ai'}; return AI(prompt,opts); }
async function askJSON(prompt,opts={}){ if(!AI)throw {code:'no_ai'}; return AI.json(prompt,opts); }
function aiError(e){

/* ---- sync ---- */
function adopt(m){P=Object.assign(structuredClone(DEFAULT),m);P.settings=Object.assign({},DEFAULT.settings,m.settings||{});store.set(PKEY(),P);applySettings();route(true);}
/* Merge two copies of the progress (this device and the server) instead of letting the newer one win. */
function mergeP(a,b){
  if(!a||!a.upd)return structuredClone(b); if(!b||!b.upd)return structuredClone(a);
  const [nw,old]=(a.upd||0)>=(b.upd||0)?[a,b]:[b,a];
  if((nw.reset||0)>(old.upd||0))return structuredClone(nw); // a reset on one device wins over older copies
  const m=structuredClone(nw);
  const reviews=c=>(c.n||0)+(c.l||0);
  m.srs=Object.assign({},old.srs||{});
  for(const [k,c] of Object.entries(nw.srs||{})){const o=m.srs[k];m.srs[k]=!o||reviews(c)>reviews(o)||(reviews(c)===reviews(o)&&(c.due||0)>=(o.due||0))?c:o;}
  m.att=Object.assign({},old.att||{});
  for(const [k,r] of Object.entries(nw.att||{})){const o=m.att[k];m.att[k]=!o||(r.n||0)>(o.n||0)||((r.n||0)===(o.n||0)&&(r.last||0)>=(o.last||0))?r:o;}
  m.err=Object.assign({},old.err||{},nw.err||{});
  for(const [k,e] of Object.entries(old.err||{})){const n=(nw.err||{})[k];if(n&&(e.last||0)>(n.last||0))m.err[k]=e;}
  m.day=Object.assign({},old.day||{});
  for(const [d,x] of Object.entries(nw.day||{})){const o=m.day[d];if(!o){m.day[d]=x;continue;}const r={};for(const k of new Set([...Object.keys(o),...Object.keys(x)]))r[k]=Math.max(+o[k]||0,+x[k]||0);m.day[d]=r;}
  m.hist=Object.assign({},old.hist||{});for(const [d,n] of Object.entries(nw.hist||{}))m.hist[d]=Math.max(m.hist[d]||0,n);
  const uniq=(arr,key)=>{const seen=new Set();return arr.filter(x=>{const k=key(x);if(seen.has(k))return false;seen.add(k);return true;});};
  m.mocks=uniq([...(old.mocks||[]),...(nw.mocks||[])],x=>String(x.t)).sort((x,y)=>x.t-y.t).slice(-30);
  m.lessons=Object.assign({},old.lessons||{},nw.lessons||{});
  if(!m.diag&&old.diag)m.diag=old.diag;
  m.upd=Math.max(a.upd||0,b.upd||0)+1;
  return m;
}
async function pullRemote(){
  try{
    const j=await api('api/sync',{method:'GET'});
    if(j.data){const m=mergeP(P,j.data);const changed=JSON.stringify(m)!==JSON.stringify(j.data);adopt(m);syncState='on';if(changed){dirty.add('main');await pushRemote();}return;}
    syncState='on';dirty.add('main');await pushRemote();
  }catch(e){console.warn('sync pull',e);syncState=e&&e.code==='not_granted'?'off':'err';}
}
let syncTimer=null;
function scheduleSync(){if(!SYNC||syncState==='off')return;clearTimeout(syncTimer);syncTimer=setTimeout(pushRemote,2500);}
async function pushRemote(){
  if(!SYNC||!dirty.size)return; dirty.clear();
  try{await api('api/sync',{method:'PUT',body:{data:P,summary:typeof uiSummary==='function'?uiSummary():null}});syncState='on';}
  catch(e){if(e&&e.code==='stale'){await pullRemote();renderSync();return;}console.warn('sync push',e);dirty.add('main');syncState=e&&e.code==='not_granted'?'off':'err';}
  renderSync();
}
function renderSync(){
  const el=$('#sync');if(!el)return;
  el.className='sync'+(syncState==='on'?' on':'');
  const t=syncState==='on'?'Synced':syncState==='err'?'Sync error, saved on this device':syncState==='off'?'Tap to turn on sync':'Saved on this device';
  el.title=t;el.innerHTML='<i></i><span class="sync-t">'+t+'</span>';
  el.style.cursor=syncState==='off'||syncState==='err'?'pointer':'';
  el.onclick=(syncState==='off'||syncState==='err')?async()=>{await pullRemote();renderSync();}:null;
}

/* timer: makeTimer(seconds, onTick(left), onEnd) -> {stop, left(), pause(), resume()} ; counts down once per second */
function makeTimer(sec,onTick,onEnd){
  let left=sec,id=null;
  const start=()=>{if(id)return;id=setInterval(()=>{left--;onTick&&onTick(left);if(left<=0){clearInterval(id);id=null;onEnd&&onEnd();}},1000);};
  start();onTick&&onTick(left);
  return {stop(){if(id)clearInterval(id);id=null;},pause(){if(id)clearInterval(id);id=null;},resume:start,left:()=>left};
}
function sfx(k){
  if(P.settings.mute)return;
  try{const A=window.__actx||(window.__actx=new (window.AudioContext||window.webkitAudioContext)());const o=A.createOscillator(),g=A.createGain();o.connect(g);g.connect(A.destination);
    const f={ok:[660,990],bad:[220,170],end:[523,784]}[k]||[440,440];const t=A.currentTime;o.frequency.setValueAtTime(f[0],t);o.frequency.linearRampToValueAtTime(f[1],t+.14);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.start(t);o.stop(t+.27);}catch(e){}

/* ================= PLAN: XP, ranks, daily plan, targets, score records ================= */
const PL_W={mm:0.5,path:5,q:2,qok:2,card:1,cardnew:2,lesson:10,mock:60,diag:30,err:2,tutor:3};
const PL_RANKS=[[0,'Intern','Day one, badge on the lanyard.'],[300,'Analyst','You know where the spreadsheets live.'],[1000,'Associate','The fundamentals are solid now.'],[2500,'Manager','You run your own study sessions.'],[5000,'Director','Hard questions do not scare you any more.'],[9000,'VP','Fast, accurate and calm under the clock.'],[15000,'Partner','Rare discipline. People ask you for help.'],[25000,'CEO','The top of the ladder. Max tips his hat.']];
const TARGETS=[505,555,605,645,675,705,735,765,805];
function plDay(k){P.day=P.day||{};k=k||ymd(Date.now());return P.day[k]=P.day[k]||{xp:0};}
function plXPTotal(){return Object.values(P.day||{}).reduce((a,d)=>a+(d.xp||0),0);}
function plRank(xp){let r=PL_RANKS[0],nx=PL_RANKS[1];for(let i=0;i<PL_RANKS.length;i++){if(xp>=PL_RANKS[i][0]){r=PL_RANKS[i];nx=PL_RANKS[i+1]||null;}}return {r,nx};}
function award(kind,n){
  n=n||1; const d=plDay(); d[kind]=(d[kind]||0)+n; const before=plXPTotal();
  const gain=Math.round((PL_W[kind]||1)*n); d.xp=(d.xp||0)+gain;
  const k=ymd(Date.now()); P.hist[k]=(P.hist[k]||0)+n; touch('main');
  const a=plRank(before).r, b=plRank(plXPTotal()).r;
  window.__xpFly&&window.__xpFly(gain);
  if(b!==a){if(window.__rankUp)window.__rankUp(b);else toast('New title: '+b[1],4000);}
  const goal=plGoalXP(); if(d.xp>=goal&&d.xp-gain<goal){if(window.__goalDone)setTimeout(window.__goalDone,b!==a?2500:600);}
}
function plCfg(){P.plan=P.plan||{target:655,minutes:45,start:today()};return P.plan;}
function plGoalXP(){return Math.round(plCfg().minutes*2.5);}
/* daily question counts per section from the minutes (about 2 min per question incl. review) */
function plCounts(){const m=plCfg().minutes;return m>=90?{quant:12,verbal:10,di:8,cards:25}:m>=60?{quant:10,verbal:8,di:6,cards:20}:m>=45?{quant:8,verbal:6,di:5,cards:15}:m>=30?{quant:5,verbal:4,di:3,cards:12}:{quant:3,verbal:3,di:2,cards:8};}
/* difficulty to practise at: around the learner's level, nudged toward the target */
function plDiffFor(sec){
  const e=secEstimate(sec); const tgt=plCfg().target;
  const tDiff=tgt>=705?4.5:tgt>=655?4:tgt>=605?3:tgt>=555?2:1.5;
  if(e.theta==null)return clamp(Math.round(P.diag&&P.diag[sec]!=null?P.diag[sec]+3:Math.min(3,tDiff)),1,5);
  return clamp(Math.round(e.theta+3+0.5),1,5);
}
function secToday(sec){const d=plDay();return d['s_'+sec]||0;}
function plTasks(){
  const c=plCounts(), d=plDay(), dow=new Date().getDay();
  let due=0;try{due=cardsDue().length;}catch(e){}
  const errN=errOpen().length;
  const t=[];
  // beginners: the next Start-here step comes first until the path is done
  try{if(LESSONS.length){const ps=pathState();if(ps.next&&ps.done<ps.steps.length){const n=ps.next;t.push({k:'path',t:'Start here: '+(n.kind==='lesson'?n.l.title:n.title),sub:`Step ${ps.done+1} of ${ps.steps.length} on the beginner path`,done:Object.values(P.path||{}).some(r=>r.t>=today()&&!r.skip)||ps.steps.some(s=>s.kind==='lesson'&&P.lessons[s.l.id]>=today()),go:'start',step:n});}}}catch(e){}
  t.push(
    {k:'quant',t:`Quant set: ${c.quant} questions`,sub:'Problem Solving at your level',done:secToday('quant')>=c.quant,go:'quant',n:[secToday('quant'),c.quant]},
    {k:'verbal',t:`Verbal set: ${c.verbal} questions`,sub:'Critical Reasoning and Reading Comprehension',done:secToday('verbal')>=c.verbal,go:'verbal',n:[secToday('verbal'),c.verbal]},
    {k:'di',t:`Data Insights set: ${c.di} questions`,sub:'Data Sufficiency, tables, charts, two-part, multi-source',done:secToday('di')>=c.di,go:'di',n:[secToday('di'),c.di]},
    {k:'cards',t:'Flashcards',sub:due?`${due} cards due`:'Formulas, CR patterns, DS rules',done:(d.card||0)+(d.cardnew||0)>=Math.min(c.cards,Math.max(due,5)),go:'cards',n:[(d.card||0)+(d.cardnew||0),Math.min(c.cards,Math.max(due,5))]},
  );
  t.push({k:'mm',t:'Mental math sprint',sub:'2 minutes, no calculator',done:(d.mm||0)>0||(P.mm&&P.mm.last===ymd(Date.now())),go:'mental'});
  if(plCfg().minutes>=30)t.push({k:'lesson',t:'One lesson',sub:'Read, check the worked examples, mark it done',done:(d.lesson||0)>=1,go:'lessons'});
  if(errN)t.push({k:'err',t:'Error log review',sub:errN+' questions waiting',done:(d.err||0)>=Math.min(3,errN),go:'errors',n:[d.err||0,Math.min(3,errN)]});
  if(dow===6||dow===0)t.push({k:'mock',t:'Weekend mock',sub:'Full adaptive mock, or one timed section',done:(d.mock||0)>=1,go:'mock'});
  return t;
}
function plWeek(){let xp=0,act=0,q=0;for(let i=0;i<7;i++){const d=(P.day||{})[ymd(today()-i*DAY)];if(d){xp+=d.xp||0;if(d.xp)act++;q+=d.q||0;}}return {xp,act,q};}

/* ---------- score estimate ----------
   Prefers the latest full mock (if within 21 days and no newer evidence is much larger), otherwise practice-based estimates. */
function scoreNow(){
  const est={}; SECS.forEach(s=>est[s]=secEstimate(s));
  const lastMock=(P.mocks||[]).filter(x=>x.full).slice(-1)[0];
  const out={quant:est.quant.score,verbal:est.verbal.score,di:est.di.score,src:'practice',n:est};
  if(lastMock&&Date.now()-lastMock.t<21*DAY){SECS.forEach(s=>{if(lastMock[s]&&lastMock[s].score!=null&&(out[s]==null||est[s].n<40))out[s]=lastMock[s].score;});out.src='mock';}
  if(P.diag)SECS.forEach(s=>{if(out[s]==null&&P.diag[s+'S']!=null)out[s]=P.diag[s+'S'];});
  out.total=totalScore(out.quant,out.verbal,out.di);
  return out;
}

const ERR_REASONS=[['concept','Did not know the concept'],['careless','Careless slip'],['misread','Misread the question'],['time','Ran out of time / rushed'],['guess','Guessed'],['trap','Fell for a trap answer']];
function errOpen(){return Object.entries(P.err||{}).filter(([id,e])=>!e.done&&QI.has(id)).map(([id,e])=>Object.assign({id,q:QI.get(id)},e)).sort((a,b)=>b.last-a.last);}
function errFixed(){return Object.entries(P.err||{}).filter(([id,e])=>e.done&&QI.has(id)).map(([id,e])=>Object.assign({id,q:QI.get(id)},e)).sort((a,b)=>b.done-a.done);}

const DS_CHOICES=['Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.','Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.','BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.','EACH statement ALONE is sufficient.','Statements (1) and (2) TOGETHER are NOT sufficient.'];

function bindSort(root){

/* ---------- charts: bar (grouped), stacked, line, scatter ---------- */
const CH_COLS=['var(--accent)','var(--orange)','#2C8C7A','#C8372F','#6B7280'];
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const m=v/p;return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p;}
function chartSVG(ch){
  const W=640,H=340,L=58,R=16,T=20,B=58, w=W-L-R, h=H-T-B;
  const xs=ch.x||[], ser=ch.series||[]; const kind=ch.kind||'bar';
  let ymin=0,ymax=0, xmin=0,xmax=1;
  if(kind==='stacked'){xs.forEach((_,i)=>{let s=0;ser.forEach(se=>s+=+se.values[i]||0);ymax=Math.max(ymax,s);});}
  else ser.forEach(se=>se.values.forEach(v=>{ymax=Math.max(ymax,v);ymin=Math.min(ymin,v);}));
  if(kind==='scatter'||(kind==='line'&&xs.every(x=>typeof x==='number'))){xmin=Math.min(...xs);xmax=Math.max(...xs);}
  if(kind==='scatter'||kind==='line'){const lo=Math.min(...ser.flatMap(s=>s.values));if(lo>0&&lo>ymax*0.4){ymin=Math.floor(lo*0.8/niceMax(ymax/5))*niceMax(ymax/5);}}
  const top=niceMax(ymax>0?ymax*1.05:1), bot=ymin<0?-niceMax(-ymin*1.05):ymin;
  const Y=v=>T+h-(v-bot)/(top-bot)*h;
  const ticks=5, grid=[];for(let i=0;i<=ticks;i++){const v=bot+(top-bot)*i/ticks;grid.push(`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" class="ch-g"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" class="ch-t">${+v.toFixed(2)}</text>`);}
  let body='', xl='';
  const n=xs.length, band=w/Math.max(1,n);
  const numericX=(kind==='scatter'||kind==='line')&&xs.every(x=>typeof x==='number');
  const X=i=>numericX?L+(xs[i]-xmin)/((xmax-xmin)||1)*w:L+band*(i+.5);
  if(kind==='bar'){const g=ser.length,bw=Math.min(36,band*0.8/g);
    xs.forEach((_,i)=>ser.forEach((se,k)=>{const v=+se.values[i]||0,x0=L+band*(i+.5)-bw*g/2+bw*k;body+=`<rect x="${x0}" y="${Math.min(Y(v),Y(0))}" width="${bw-2}" height="${Math.abs(Y(0)-Y(v))}" fill="${CH_COLS[k%5]}" rx="2"><title>${esc(se.name)}: ${v}</title></rect>`;}));}
  else if(kind==='stacked'){const bw=Math.min(48,band*0.6);
    xs.forEach((_,i)=>{let acc=0;ser.forEach((se,k)=>{const v=+se.values[i]||0;body+=`<rect x="${L+band*(i+.5)-bw/2}" y="${Y(acc+v)}" width="${bw}" height="${Y(acc)-Y(acc+v)}" fill="${CH_COLS[k%5]}"><title>${esc(se.name)}: ${v}</title></rect>`;acc+=v;});});}
  else if(kind==='line'){ser.forEach((se,k)=>{const pts=se.values.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');body+=`<polyline points="${pts}" fill="none" stroke="${CH_COLS[k%5]}" stroke-width="2.5"/>`+se.values.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="${CH_COLS[k%5]}"><title>${esc(se.name)} ${esc(xs[i])}: ${v}</title></circle>`).join('');});}
  else if(kind==='scatter'){ser.forEach((se,k)=>{body+=se.values.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="5" fill="${CH_COLS[k%5]}" fill-opacity=".85"><title>(${xs[i]}, ${v})</title></circle>`).join('');});}
  if(numericX){const tk=6;for(let i=0;i<=tk;i++){const v=xmin+(xmax-xmin)*i/tk;const x=L+i/tk*w;xl+=`<text x="${x}" y="${T+h+18}" text-anchor="middle" class="ch-t">${+v.toFixed(1)}</text>`;}}
  else{const rot=n>8||xs.some(x=>String(x).length>8);xs.forEach((x,i)=>{xl+=rot?`<text transform="translate(${X(i)},${T+h+14}) rotate(-35)" text-anchor="end" class="ch-t">${esc(x)}</text>`:`<text x="${X(i)}" y="${T+h+18}" text-anchor="middle" class="ch-t">${esc(x)}</text>`;});}
  const legend=ser.length>1||kind!=='scatter'?`<div class="ch-leg">${ser.map((s,k)=>`<span><i style="background:${CH_COLS[k%5]}"></i>${esc(s.name)}</span>`).join('')}</div>`:'';
  return `<figure class="chart">${ch.title?`<figcaption>${esc(ch.title)}</figcaption>`:''}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(ch.title||'chart')}">${grid.join('')}<line x1="${L}" x2="${W-R}" y1="${Y(Math.max(bot,0))}" y2="${Y(Math.max(bot,0))}" class="ch-a"/>${body}${xl}
    ${ch.ylabel?`<text transform="translate(14,${T+h/2}) rotate(-90)" text-anchor="middle" class="ch-l">${esc(ch.ylabel)}</text>`:''}${ch.xlabel?`<text x="${L+w/2}" y="${H-6}" text-anchor="middle" class="ch-l">${esc(ch.xlabel)}</text>`:''}</svg>${legend}</figure>`;
}

function qHTML(q,a,{reveal=false,lock=false}={}){

/* ---------- on-screen calculator (Data Insights only, like the real exam) ---------- */
function openCalc(){
  if($('#calc')){$('#calc').remove();return;}
  const d=document.createElement('div');d.id='calc';d.className='calc';d.setAttribute('role','dialog');d.setAttribute('aria-label','Calculator');
  const keys=['MC','MR','M+','√','7','8','9','÷','4','5','6','×','1','2','3','-','0','.','%','+','C','(',')','='];
  d.innerHTML=`<div class="calc-h"><b>Calculator</b><button class="spk sm" id="calcX" aria-label="Close calculator">${ic('x')}</button></div><input id="calcD" class="calc-d num" inputmode="decimal" value="0" aria-label="Display"><div class="calc-k">${keys.map(k=>`<button data-k="${k}" class="${'=+-×÷'.includes(k)?'op':''}">${k}</button>`).join('')}</div>`;
  document.body.appendChild(d);
  let mem=0; const disp=$('#calcD',d);
  const evalExpr=t=>{const s=t.replace(/×/g,'*').replace(/÷/g,'/').replace(/√\(?([0-9.]+)\)?/g,'Math.sqrt($1)').replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');
    if(!/^[0-9+\-*/().\s]*$/.test(s.replace(/Math\.sqrt/g,'')))throw 0;const v=Function('"use strict";return ('+s+')')();if(!isFinite(v))throw 0;return +(+v).toPrecision(12);};
  const press=k=>{let t=disp.value;
    if(k==='C'){disp.value='0';return;}
    if(k==='='){try{disp.value=String(evalExpr(t));}catch(e){disp.value='Error';}return;}
    if(k==='MC'){mem=0;return;} if(k==='MR'){disp.value=(t==='0'||t==='Error')?String(mem):t+mem;return;}
    if(k==='M+'){try{mem+=evalExpr(t);toast('Memory: '+mem,1200);}catch(e){}return;}
    if(t==='0'||t==='Error')t='';
    disp.value=t+k;};
  $$('[data-k]',d).forEach(b=>b.onclick=()=>press(b.dataset.k));
  disp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();press('=');}};
  $('#calcX',d).onclick=()=>d.remove();
}

const PR_LAST=store.get('calculis-pr',{});

function secTopics(sec){const m=new Map();QS.filter(q=>q.sec===sec).forEach(q=>{m.set(q.topic,(m.get(q.topic)||0)+1);});return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0]));}
/* default mix when no topic is chosen: share of questions per topic family */
const MIX={verbal:[['rc',0.5],['cr',0.5]],di:[['ds',0.4],['ta',0.15],['gi',0.15],['tpa',0.15],['msr',0.15]]};
function unitPool(sec,{topics,diffs,types}={}){
  return UNITS.filter(u=>u.sec===sec&&(!types||types.includes(u.type))&&u.qs.some(q=>(!topics||!topics.length||topics.includes(q.topic))&&(!diffs||!diffs.length||diffs.includes(q.diff))));
}
function unitRank(u,target,fresh){
  const att=u.qs.map(q=>P.att[q.qid]);const seenN=att.filter(Boolean).length;const last=Math.max(0,...att.map(r=>r?r.last:0));
  const wrong=att.some(r=>r&&!r.lastOk);
  return (seenN?(fresh?1e6:0)+(wrong?-2e5:0)+last/1e6:0)+Math.abs((u.diff||3)-target)*10+Math.random()*6;
}
function pickSet(sec,{topics=[],diffs=[],n=10,fresh=true,target}={}){
  target=target!=null?target:plDiffFor(sec);
  const take=(pool,want,out)=>{const ranked=pool.map(u=>[unitRank(u,target,fresh),u]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
    let got=0;for(const u of ranked){if(got>=want)break;const qs=u.qs.filter(q=>(!topics.length||topics.includes(q.topic))&&(!diffs.length||diffs.includes(q.diff)));
      const room=want-got; if(qs.length>room+1&&got>0)continue; const sel=qs.slice(0,Math.max(room,Math.min(qs.length,room+1)));out.push(sel);got+=sel.length;}return got;};
  const blocks=[];
  if(!topics.length&&MIX[sec]){let left=n;const mix=MIX[sec];
    mix.forEach(([t,share],i)=>{if(left<=0)return;let want=i===mix.length-1?left:Math.max(t==='msr'&&n<8?0:1,Math.round(n*share));if(t==='msr'&&n<8)want=0;want=Math.min(want,left);if(!want)return;
      const got=take(unitPool(sec,{diffs,types:[t]}),want,blocks);left-=got;});
    if(left>0)take(unitPool(sec,{diffs}),left,blocks);
  }else take(unitPool(sec,{topics,diffs}),n,blocks);
  // keep multi-question units together, shuffle the order of blocks
  const seen=new Set();return shuffle(blocks).flat().filter(q=>!seen.has(q.qid)&&seen.add(q.qid));
}

let PS=null;
function prStart(qs,opts){
  if(!qs.length){toast('No questions to show.');return;}
  PS=Object.assign({qs,i:0,ans:{},res:{},secs:{},t0:Date.now(),qStart:Date.now(),mode:'practice',tab:0},opts);
  PS.budget=opts.timed?qs.reduce((a,q)=>a+targetTime(q),0):0;

}

function prSummary(el){

/* ================= MOCK EXAMS and DIAGNOSTIC =================
   Engine: sections run one after another; inside a section the next question is picked adaptively from the
   current ability estimate (diff closest to theta+3, unseen units first). No going back during a section; at the end
   the Question Review & Edit screen allows changing up to 3 answers (bookmarks help), as in the GMAT Focus Edition.
   Time up ends the section; unanswered questions count as wrong. */
const MK_TIME={quant:45*60,verbal:45*60,di:45*60};
const MK_N={quant:21,verbal:23,di:20};
const MK_PAT={quant:['ps'],verbal:['cr','cr','rc','cr','cr','rc','cr','rc','cr','cr','rc','cr'],di:['ds','gi','tpa','ds','ta','msr','ds','gi','tpa','ds','ta','ds','gi','tpa','ds','ta','ds']};
const DG_N={quant:6,verbal:5,di:4};
const DG_PAT={quant:['ps'],verbal:['cr'],di:['ds','tpa','ds','gi']};
const ORDERS=[['quant','verbal','di'],['quant','di','verbal'],['verbal','quant','di'],['verbal','di','quant'],['di','quant','verbal'],['di','verbal','quant']];
let MK=null;
function mkUsed(){const s=new Set();(P.mocks||[]).forEach(m=>(m.items||[]).forEach(it=>{const q=QI.get(it[0]);if(q)s.add(q.unit.id);}));return s;}
function mkPick(S){
  const used=MK.usedUnits, before=MK.prevUnits;
  const th=estTheta(S.qs.filter(q=>S.ans[q.qid]!=null).map(q=>({q,ok:isRight(q,S.ans[q.qid])})),S.prior)??S.prior;
  const target=clamp(th+3,1,5);
  const pat=S.pat, left=S.n-S.qs.length; if(left<=0)return false;
  let type=pat[S.slot%pat.length]; S.slot++;
  if((type==='rc'||type==='msr')&&left<3)type=S.sec==='verbal'?'cr':'ds';
  let pool=UNITS.filter(u=>u.sec===S.sec&&u.type===type&&!used.has(u.id));
  if(!pool.length)pool=UNITS.filter(u=>u.sec===S.sec&&!used.has(u.id)&&u.qs.length===1);
  if(!pool.length)return false;
  const rank=u=>Math.abs((u.diff||3)-target)*10+(before.has(u.id)?40:0)+(u.qs.some(q=>P.att[q.qid])?8:0)+Math.random()*4;
  const u=pool.map(u=>[rank(u),u]).sort((a,b)=>a[0]-b[0])[0][1];
  used.add(u.id);
  u.qs.slice(0,left).forEach(q=>S.qs.push(q));
  return true;
}
function mkNew(kind,order,breakAfter){
  const secs=kind==='full'?order:kind==='diag'?['quant','verbal','di']:[order[0]];
  MK={kind,order:secs,breakAfter:kind==='full'?breakAfter:-1,si:0,phase:'intro',usedUnits:new Set(),prevUnits:mkUsed(),t0:Date.now(),
    secs:secs.map(sec=>{const e=secEstimate(sec);return {sec,n:kind==='diag'?DG_N[sec]:MK_N[sec],pat:kind==='diag'?DG_PAT[sec]:MK_PAT[sec],slot:0,qs:[],ans:{},secs:{},flags:{},edits:0,i:0,
      left:kind==='diag'?0:MK_TIME[sec],prior:e.theta!=null?clamp(e.theta,-1.5,1.5):0};})};
  current='exam';try{history.pushState(null,'','#exam');}catch(e){}route();window.scrollTo(0,0);
}

  };

function mkFinish(){
  const rec={t:Date.now(),kind:MK.kind,full:MK.kind==='full',order:MK.order,items:[]};
  MK.secs.forEach(s=>{
    // pad unfinished sections: unseen questions count as wrong (unanswered)
    const res=s.qs.map(q=>({q,ok:isRight(q,s.ans[q.qid])}));
    const missing=MK.kind==='diag'?0:Math.max(0,s.n-s.qs.length); const filler={diff:3,type:'ps',sq:{}};
    for(let i=0;i<missing;i++)res.push({q:filler,ok:false});
    const th=estTheta(res);
    rec[s.sec]={score:secScore(th),theta:th,ok:res.filter(r=>r.ok).length,n:s.n,used:Math.round((MK_TIME[s.sec]-s.left)),edits:s.edits};
    s.qs.forEach(q=>{const a=s.ans[q.qid];if(a!=null)recordAttempt(q,a,s.secs[q.qid]||0,{mode:'mock'});rec.items.push([q.qid,isRight(q,a)?1:0,Math.round(s.secs[q.qid]||0)]);});
  });
  if(MK.kind==='full')rec.total=totalScore(rec.quant.score,rec.verbal.score,rec.di.score);
  if(MK.kind==='diag'){P.diag={t:rec.t};SECS.forEach(sec=>{P.diag[sec]=rec[sec].theta;P.diag[sec+'S']=rec[sec].score;});P.diag.total=totalScore(rec.quant.score,rec.verbal.score,rec.di.score);rec.total=P.diag.total;}
  P.mocks=(P.mocks||[]).concat([rec]).slice(-30); MK.rec=rec;
  touch('main'); award(MK.kind==='diag'?'diag':'mock',MK.kind==='section'?0.4:1); sfx('end');
}

/* ================= START HERE: guided path for beginners, glossary, mental math =================
   Path = ordered steps. Lesson step: done when the lesson is marked learned. Drill step: 5 easy questions on the lesson topic,
   done with >= 4/5 (or after two tries, so nobody gets stuck). Steps unlock in order; any step can be skipped. */
let GLOSS=[];
function loadGloss(){return GLOSS.length?Promise.resolve(GLOSS):loadJSON('glossary').then(g=>GLOSS=g).catch(()=>GLOSS);}
function pathSteps(){
  if(!LESSONS.length)return [];
  const steps=[]; const by=s=>LESSONS.filter(l=>l.sec===s);
  by('start').forEach((l,i)=>{steps.push({id:'L:'+l.id,kind:'lesson',l,stage:'Getting started'});
    if(i===1)steps.push({id:'X:diag',kind:'diag',stage:'Getting started',title:'Take the diagnostic',sub:'15 questions, about 25 minutes, to see where you start'});});
  const stageName={quant:'Quant foundations',verbal:'Verbal foundations',di:'Data Insights foundations',strategy:'Exam strategy'};
  ['quant','verbal','di'].forEach(sec=>by(sec).filter(l=>l.level!=='advanced').forEach(l=>{
    steps.push({id:'L:'+l.id,kind:'lesson',l,stage:stageName[sec]});
    steps.push({id:'D:'+l.id,kind:'drill',l,stage:stageName[sec],title:'Practice: '+l.title,sub:'5 easy questions, 4 right to pass'});}));
  by('strategy').forEach(l=>steps.push({id:'L:'+l.id,kind:'lesson',l,stage:stageName.strategy}));
  steps.push({id:'X:mock',kind:'mock',stage:'Exam strategy',title:'Your first timed section',sub:'One 45-minute section, any one you like'});
  return steps;
}
function stepDone(s){
  const p=P.path||{};
  if(p[s.id]&&(p[s.id].done||p[s.id].skip))return true;
  if(s.kind==='lesson')return !!P.lessons[s.l.id];
  if(s.kind==='diag')return !!P.diag;
  if(s.kind==='mock')return (P.mocks||[]).some(m=>m.kind!=='diag');
  return false;
}
function pathState(){const steps=pathSteps();const next=steps.find(s=>!stepDone(s));return {steps,next,done:steps.filter(stepDone).length};}
function drillQs(l){
  const pool=lessonQs(l).filter(q=>q.diff<=2&&q.unit.qs.length===1);
  const fresh=shuffle(pool.filter(q=>!P.att[q.qid])), old=shuffle(pool.filter(q=>P.att[q.qid]));
  let out=[...fresh,...old].slice(0,5);
  if(!out.length&&/reading|passage|RC /i.test(l.title+' '+l.topic)){const u=UNITS.filter(u=>u.type==='rc').sort((a,b)=>(a.diff-b.diff)||((a.qs.some(q=>P.att[q.qid])?1:0)-(b.qs.some(q=>P.att[q.qid])?1:0)))[0];if(u)return u.qs.slice();}
  if(out.length<5){const more=shuffle(lessonQs(l).filter(q=>q.diff<=3&&q.unit.qs.length===1&&!out.includes(q)));out=out.concat(more).slice(0,5);}
  return out;
}
function runStep(s){
  if(s.kind==='lesson'){PATH_FROM=true;openLesson(s.l.id);return;}
  if(s.kind==='diag'){go('diag');return;}
  if(s.kind==='mock'){go('mock');return;}
  loadBank().then(()=>{const qs=drillQs(s.l);if(!qs.length){P.path=P.path||{};P.path[s.id]={done:1,t:Date.now()};touch('main');toast('No easy questions for this topic yet, step skipped.');route();return;}
    prStart(qs,{title:s.title,sec:qs[0].sec,onDone:(ok,n)=>{P.path=P.path||{};const r=P.path[s.id]||{tries:0};r.tries=(r.tries||0)+1;r.best=Math.max(r.best||0,ok);
      const need=n>=5?4:Math.ceil(n*0.6);if(ok>=need||r.tries>=2){r.done=1;r.t=Date.now();toast(ok>=need?'Step passed. Next one unlocked.':'Moving on. These questions stay in your error log.');}else toast(`${ok}/${n}. You need ${need} to pass. Read the explanations and try again.`,4000);
      P.path[s.id]=r;touch('main');}});});
}

/* ---------- mental math: 2-minute sprint, no calculator ---------- */
const MM_FR=[[1,2],[1,3],[2,3],[1,4],[3,4],[1,5],[2,5],[3,5],[4,5],[1,6],[5,6],[1,8],[3,8],[5,8],[7,8],[1,9],[1,10],[3,10],[1,12],[1,16],[1,20],[1,25],[1,40],[1,50]];
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function mmItem(){
  const k=ri(0,8);
  if(k===0){const [a,b]=pick(MM_FR);return {q:`${a}/${b} as a percent`,a:100*a/b,tol:0.4,show:(+(100*a/b).toFixed(2))+'%'};}
  if(k===1){const n=ri(11,25);return {q:`${n}²`,a:n*n};}
  if(k===2){const n=ri(2,10);return {q:`${n}³`,a:n**3};}
  if(k===3){const n=ri(2,12);return {q:`2^${n}`,a:2**n};}
  if(k===4){const p=pick([5,10,12.5,15,20,25,30,40,60,75]),n=pick([40,60,80,120,160,240,360,480]);return {q:`${p}% of ${n}`,a:p*n/100};}
  if(k===5){const a=ri(12,49),b=ri(3,9);return {q:`${a} × ${b}`,a:a*b};}
  if(k===6){const b=ri(3,15),c=ri(6,25);return {q:`${b*c} ÷ ${b}`,a:c};}
  if(k===7){const n=ri(4,25);return {q:`√${n*n}`,a:n};}
  const a=ri(11,19),b=ri(11,19);return {q:`${a} × ${b}`,a:a*b};
}

/* ================= LEARN: lessons and flashcards (spaced repetition) ================= */
let LESSONS=[], CARDS=[];
function loadLearn(){if(LESSONS.length)return Promise.resolve({l:LESSONS,c:CARDS});return Promise.all([loadJSON('lessons').catch(()=>[]),loadJSON('cards').catch(()=>[]),loadGloss()]).then(([l,c,g])=>{LESSONS=l;
  // glossary terms become a flashcard deck of their own
  CARDS=c.concat((g||[]).map(x=>({id:x.id,sec:'terms',topic:x.group,front:x.term,back:x.vi+(x.ex?'\n'+x.ex:''),level:1})));return {l,c:CARDS};});}
function bodyHTML(t){
  const out=[];let list=null,para=[];
  const flushP=()=>{if(para.length){out.push(`<p>${fmt(para.join(' '))}</p>`);para=[];}};
  const flushL=()=>{if(list){out.push(`<ul>${list.map(x=>`<li>${fmt(x)}</li>`).join('')}</ul>`);list=null;}};
  String(t||'').split('\n').forEach(line=>{const l=line.trim();
    if(!l){flushP();flushL();return;}
    if(/^[-•] /.test(l)){flushP();(list=list||[]).push(l.slice(2));return;}
    flushL();
    if(l.length<90&&/[=≤≥<>]/.test(l)&&!/[.?!:]$/.test(l)&&l.split(' ').length<16){flushP();out.push(`<div class="formula">${fmt(l)}</div>`);return;}
    para.push(l);});
  flushP();flushL();return out.join('');
}
const LS_SEC=[['start','Start here'],['quant','Quant'],['verbal','Verbal'],['di','Data Insights'],['strategy','Strategy']];

}

/* ================= AI TUTOR: "Ask Max" on any question, and a free chat view ================= */
const MAX_SYS=`You are Max, a friendly, sharp GMAT Focus Edition tutor (a fox mascot) inside the Calculis study app. The exam has Quant (Problem Solving only, no geometry, no calculator), Verbal (Critical Reasoning and Reading Comprehension only) and Data Insights (Data Sufficiency, Table Analysis, Graphics Interpretation, Two-Part Analysis, Multi-Source Reasoning). Reply in clear, plain English. Be concise: short paragraphs, step-by-step working, numbered steps when useful, no LaTeX (write x², √, ≤ in plain Unicode), no em dashes. Prefer the fastest valid method and mention a shortcut (picking numbers, backsolving, estimation) when it helps. If you are not sure about something, say so.`;
function mdHTML(t){
  const out=[];let list=null,lt='ul',para=[];
  const flushP=()=>{if(para.length){out.push(`<p>${fmt(para.join('\n'))}</p>`);para=[];}};
  const flushL=()=>{if(list){out.push(`<${lt}>${list.map(x=>`<li>${fmt(x)}</li>`).join('')}</${lt}>`);list=null;}};
  String(t||'').replace(/<think>[\s\S]*?<\/think>/g,'').split('\n').forEach(line=>{const l=line.trim();
    if(!l){flushP();flushL();return;}
    let m=l.match(/^[-*•] (.*)/);if(m){flushP();if(list&&lt!=='ul')flushL();lt='ul';(list=list||[]).push(m[1]);return;}
    m=l.match(/^\d+[.)] (.*)/);if(m){flushP();if(list&&lt!=='ol')flushL();lt='ol';(list=list||[]).push(m[1]);return;}
    m=l.match(/^#+ (.*)/);if(m){flushP();flushL();out.push(`<p><b>${fmt(m[1])}</b></p>`);return;}
    flushL();para.push(l);});
  flushP();flushL();return out.join('');
}
function qText(q,a){
  const s=q.sq,u=q.unit.src,L=i=>LET[i];
  const ch=arr=>arr.map((c,i)=>`(${L(i)}) ${c}`).join('\n');
  let t=`Question type: ${TYPE_NAME[q.type]} (${q.sub||q.topic}), difficulty ${q.diff}/5.\n`;
  if(q.type==='ps')t+=`${s.stem}\n${ch(s.choices)}`;
  else if(q.type==='ds')t+=`${s.info?s.info+'\n':''}${s.question}\n(1) ${s.s1}\n(2) ${s.s2}\nStandard DS answer choices: (A) 1 alone, (B) 2 alone, (C) together, (D) each alone, (E) not sufficient.`;
  else if(q.type==='cr')t+=`${s.stimulus.replace(/\*\*/g,'[bold]')}\n${s.stem}\n${ch(s.choices)}`;
  else if(q.type==='rc')t+=`Passage:\n${u.paras.join('\n\n')}\n\n${s.stem}\n${ch(s.choices)}`;
  else if(q.type==='msr')t+=`Sources:\n${u.tabs.map(x=>`[${x.title}] ${x.text||''}${x.table?'\n'+[x.table.cols.join(' | '),...x.table.rows.map(r=>r.join(' | '))].join('\n'):''}`).join('\n')}\n\n${s.kind==='mcq'?s.stem+'\n'+ch(s.choices):s.prompt+'\n'+s.statements.map((x,i)=>`${i+1}. ${x.text}`).join('\n')}`;
  else if(q.type==='ta')t+=`${s.intro||''}\nTable: ${s.cols.join(' | ')}\n${s.rows.map(r=>r.join(' | ')).join('\n')}\n${s.prompt}\n${s.statements.map((x,i)=>`${i+1}. ${x.text}`).join('\n')}`;
  else if(q.type==='gi')t+=`${s.intro||''}\nChart (${s.chart.kind}): ${s.chart.title}. x = ${s.chart.x.join(', ')}\n${s.chart.series.map(se=>se.name+': '+se.values.join(', ')).join('\n')}\nSentence: ${s.text}\n${s.blanks.map((b,i)=>`Blank ${i+1} options: ${b.options.join(' / ')}`).join('\n')}`;
  else if(q.type==='tpa')t+=`${s.stem}\nColumns: ${s.cols.join(' / ')}\nOptions:\n${s.options.map((o,i)=>`${i+1}. ${o}`).join('\n')}`;
  const k=keyOf(q);
  const show=v=>v==null?'no answer':Array.isArray(v)?v.map(x=>x==null?'-':(q.type==='tpa'?s.options[x]:q.type==='gi'?'option '+(x+1):(s.labels||['True','False'])[x])).join(', '):'('+L(v)+')';
  t+=`\n\nCorrect answer: ${show(k)}\nStudent's answer: ${show(a)}\nOfficial explanation: ${s.explanation||u.explanation||''}`;
  return t;
}
